<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="search">
                <input type="text" id="city-input" placeholder="Enter city name">
                <button id="search-btn"><img src="images/search.png" alt="Search"></button>
            </div>
            <div class="weather">
                <img src="images/default.png" class="weather-icon">
                <h1 class="temp">--°C</h1>
                <h2 class="city">City</h2>
                <div class="details">
                    <p class="wind">Wind: -- km/hr</p>
                    <p class="humidity">Humidity: --%</p>
                    <p class="pressure">Pressure: -- hPa</p>
                </div>
                <div class="unit-toggle">
                    <button id="toggle-unit">Switch to °F</button>
                </div>
            </div>
            
            <button id="get-location">Get Weather for My Location</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
